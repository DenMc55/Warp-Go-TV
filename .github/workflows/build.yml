name: Build Warp Go TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing. See SIGNING-SETUP.txt."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warp-go-tv-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/warp-go-tv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WARP_PRIVATE_KEY: ${{ secrets.WARP_PRIVATE_KEY }}
          WARP_ADDRESS_V6: ${{ secrets.WARP_ADDRESS_V6 }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Warp-Go-TV-v1.4.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warp-go-tv-v1.4.${{ github.run_number }}
          name: Warp Go TV v1.4.${{ github.run_number }}
          body: |
            Automated signed release build of Warp Go TV.

            New in v1.4:
            - First-run TV / Mobile interface selector, defaulting to TV.
            - TV interface keeps the proven Fire TV layout and D-pad behaviour.
            - Mobile interface uses a single-column touch layout with the same blue/orange branding.
            - Auto-connect on boot is available in both interfaces.
            - New Warp Go logo and launcher icon.
            - Permanent release signing so future updates can install over this build.

            Important: v1.4 uses a new permanent release signing key. Because previous builds used temporary debug signing, uninstall the old build once before installing v1.4. Future signed versions can update v1.4 in place.
          files: out/*.apk
