name: Build Warp Go TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Warp-Go-TV-v1.1.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warp-go-tv-v1.1.${{ github.run_number }}
          name: Warp Go TV v1.1.${{ github.run_number }}
          body: |
            Automated build of Warp Go TV.

            TV-first Cloudflare WARP client with D-pad focus improvements,
            dark theme, clear connection status, and auto-connect on boot.

            Download the `.apk` below and sideload it onto your Android or Fire TV device.
          files: out/*.apk
